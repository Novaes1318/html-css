<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 06</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML podemos utilizar elementos de lista à seguir, passe o mouse para saber qual tag utilizar:</p>
    <ul type="square">
        <li><span title="Use a tag <p>">Parágrafo</span></li>
        <li><span title="Use a tag <h1>">Título</span></li>
         <li><span title="Use a tag <img>"></span>Imagem</li> 
         <li><span title="Use a tag <abbr>">Abreviações</span></li>  
        <li><span title="Use a tag <code>">Códigos-fonte</span></li>
        <li><span title="Use a tag <ol>">Listas numeradas</span></li>
        <li><span title="Use a tag <de>">Listas demarcadas</span></li>
        <li><span title="Use a tag <blockquote>">Citações completas</span></li>
        <li><span title="Use a tag <q>">Citações simples</span></li>
        
    </ul>
   

    
</body>
</html>
