<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos com HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Este vídeo está hospedado no meu própro servidor</p>
    <!--<video src="midia/meu-video.mp4.mp4" width="500"controls></video>-->
    <video width="560" poster="imagens/imagem-abobora.png.png" controls>
       <source src="midia/meu-video.mkv.mkv" type="video/mkv">
       <source src="midia/meu-video.mp4.mp4" type="video/mp4">
       <source src="midia/meu-video.webm.webm" type="video/webm">
       <p>Seu navegador não é compatível com reprodução de vídeos</p>
    </video>
    <h1>Inserindo videos do YouTube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/i7L19SOqbNM?si=JPmRze4yfvqzr9CN" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <h1>Inserindo vídeos do Vimeo</h1>
    <iframe src="https://player.vimeo.com/video/476863648?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" width="560" height="315" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" title="Animation_Reel"></iframe>
</body>
</html>
