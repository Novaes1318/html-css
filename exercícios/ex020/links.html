<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINKS</title>
    <style>
        /*
                   Seletores Personalizados
        #  = id
        .  = class
        :  = pseudoclass
        :: = pseudo-element
        >  = children
        
        */
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        
        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: darkred;
            
        }

        a:hover {
            color: black;
            text-decoration: underline;
        }
        a:active {
            color: yellow
        }
        
        a::before {
            content:'⇒';
            color: darkgray


        }
        a::after {
            content: '[link]';
            text-decoration: none;
            font-weight: normal;
            color:darkgray;
        }

        .especial {
            background-color: aquamarine;
        }
        .especial::before {
            content: '⇒';
            color:blue

        }
        .especial::after {
            content: '⇐';
            color: blue
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://github.com/gustavoguanabara" target="_blank">Repositório GitHub</a></li>
        <li><a href="https://www.youtube.com/@cursoemvideo" class="especial" target="_blank">Canal do YouTube</a></li>
        <li><a href="https://www.cursoemvideo.com/" target="_blank">Site do CursoemVídeo</a></li>
    </ul>

    
</body>
</html>
